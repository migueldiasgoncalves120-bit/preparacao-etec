<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - Preparação Etec</title>

    <link rel="stylesheet" href="conta.css">
</head>

<body>

<div class="conta-container">

    <div class="conta-card">

        <h1>🔐 Entrar</h1>

        <p class="subtitulo">
            Entre na sua conta da Preparação Etec
        </p>


        <!-- E-MAIL -->

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            placeholder="Digite seu e-mail"
            autocomplete="email"
        >


        <!-- SENHA -->

        <label for="password">
            Senha
        </label>

        <div class="senha-container">

            <input
                type="password"
                id="password"
                placeholder="Digite sua senha"
                autocomplete="current-password"
            >

            <button
                type="button"
                class="mostrar-senha"
                onclick="mostrarSenha('password', this)"
                aria-label="Mostrar senha"
            >
                👁️
            </button>

        </div>


        <!-- BOTÃO ENTRAR -->

        <button
            class="conta-btn"
            id="loginBtn"
            type="button"
        >
            Entrar
        </button>


        <!-- ESQUECI A SENHA -->

        <button
            class="esqueci-senha"
            id="forgotPasswordBtn"
            type="button"
        >
            Esqueci minha senha
        </button>


        <!-- MENSAGEM -->

        <p
            class="conta-mensagem"
            id="message">
        </p>


        <!-- CADASTRO -->

        <p class="conta-link">

            Ainda não tem uma conta?

            <a href="cadastro.html">
                Criar conta
            </a>

        </p>


        <!-- VOLTAR -->

        <a
            class="voltar"
            href="index.html"
        >
            ← Voltar para o site
        </a>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="login.js"></script>

</body>

</html>
